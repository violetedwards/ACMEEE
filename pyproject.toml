[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ACMEEE"
license = "GPL-3.0"
version = "1.0.0"
description = "Track electronic excitations during adiabatic movement in one dimensional systems"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "iDEA-latest>=1.1.0",
    "matplotlib>=3.5",
    "numpy>=1.22",
    "Pillow>=9",
    "scipy>=1.8",
]

[project.urls]
Homepage = "https://github.com/violetedwards/acmeee"
Repository = "https://github.com/violetedwards/acmeee"
Issues = "https://github.com/violetedwards/acmeee/issues"

[tool.setuptools.packages.find]
include = ["ACMEEE*"]
